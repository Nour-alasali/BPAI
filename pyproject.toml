[project]
name = "bpai"
version = "0.1.0"
description = "Culinary ingredient analysis using NLP and knowledge graphs"
requires-python = ">=3.11,<3.12"
dependencies = [
    # Keep the verified Dash 2 baseline; validate major upgrades separately.
    "dash>=2.18.2,<3",
    "en-core-web-sm",
    "ipykernel>=6.29,<7",
    "jupyterlab>=4.3,<5",
    "matplotlib>=3.9,<4",
    "nbconvert>=7.16,<8",
    "pandas>=2.2,<3",
    "plotly>=5.24,<6",
    "rdflib>=7.1,<8",
    "requests>=2.32,<3",
    "seaborn>=0.13.2,<0.14",
    "spacy>=3.8,<3.9",
    "tabulate>=0.9,<1",
]

[tool.uv]
package = false

[tool.uv.sources]
en-core-web-sm = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl" }
